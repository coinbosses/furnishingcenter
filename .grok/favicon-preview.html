<!doctype html>
<html><head><style>
  html,body{margin:0;padding:24px;background:#6b6560;font-family:sans-serif;color:#fff;}
  .row{display:flex;gap:24px;align-items:flex-end;}
  .tile{background:#fff;display:grid;place-items:center;}
  svg{display:block;}
</style></head>
<body>
<div class="row">
  <div class="tile" style="width:16px;height:16px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
      <rect width="32" height="32" rx="7" fill="#F3EEE6"/>
      <rect x="8" y="8" width="16" height="8" rx="2.4" fill="#1C1814"/>
      <rect x="6" y="15" width="20" height="8" rx="2.2" fill="#1C1814"/>
      <rect x="8.2" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
      <rect x="21.4" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
    </svg>
  </div>
  <div class="tile" style="width:32px;height:32px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <rect width="32" height="32" rx="7" fill="#F3EEE6"/>
      <rect x="8" y="8" width="16" height="8" rx="2.4" fill="#1C1814"/>
      <rect x="6" y="15" width="20" height="8" rx="2.2" fill="#1C1814"/>
      <rect x="8.2" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
      <rect x="21.4" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
    </svg>
  </div>
  <div class="tile" style="width:64px;height:64px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="64" height="64">
      <rect width="32" height="32" rx="7" fill="#F3EEE6"/>
      <rect x="8" y="8" width="16" height="8" rx="2.4" fill="#1C1814"/>
      <rect x="6" y="15" width="20" height="8" rx="2.2" fill="#1C1814"/>
      <rect x="8.2" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
      <rect x="21.4" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
    </svg>
  </div>
  <div class="tile" style="width:128px;height:128px">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128">
      <rect width="32" height="32" rx="7" fill="#F3EEE6"/>
      <rect x="8" y="8" width="16" height="8" rx="2.4" fill="#1C1814"/>
      <rect x="6" y="15" width="20" height="8" rx="2.2" fill="#1C1814"/>
      <rect x="8.2" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
      <rect x="21.4" y="22.4" width="2.4" height="3.4" rx="0.6" fill="#1C1814"/>
    </svg>
  </div>
</div>
</body></html>
