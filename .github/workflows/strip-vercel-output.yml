name: Strip committed .vercel/output

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strip-vercel
  cancel-in-progress: true

jobs:
  strip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Nuclear remove .vercel
        id: strip
        run: |
          set -eux
          COUNT=$(git ls-files '.vercel' | wc -l)
          echo "Tracked .vercel files: $COUNT"
          if [ "$COUNT" -gt 0 ] || [ -d .vercel ]; then
            git ls-files -z '.vercel' | xargs -0 -r git rm -f --ignore-unmatch || true
            rm -rf .vercel
            git rm -f --ignore-unmatch src/lib/auth/pglite-dialect.ts || true
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.strip.outputs.removed == 'true'
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing staged"
            exit 0
          fi
          git commit -m "ci: nuclear remove .vercel/output (PGlite ENOENT fix)"
          git push origin HEAD:main --force-with-lease || git push origin HEAD:main
