name: Strip committed .vercel/output

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strip-vercel
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove .vercel if present
        id: strip
        run: |
          set -x
          if [ -d .vercel ]; then
            echo "Found .vercel — removing"
            find .vercel -type f | wc -l
            rm -rf .vercel
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .vercel directory"
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.strip.outputs.removed == 'true'
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "ci: remove committed .vercel/output (PGlite prebuild)"
          # Retry push in case of race with other commits
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi
            sleep 2
          done
          echo "Push failed after retries"
          exit 1
