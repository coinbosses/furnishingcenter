name: Strip committed .vercel/output

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strip-vercel
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild tree without .vercel and force-push main
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove every tracked .vercel path
          if git ls-files '.vercel' | grep -q .; then
            git ls-files -z '.vercel' | xargs -0 git rm -rf --cached || true
          fi
          rm -rf .vercel

          # Also drop the unused stub if present
          git rm -f --ignore-unmatch src/lib/auth/pglite-dialect.ts || true

          # Stage everything else as a clean tree on an orphan branch
          git checkout --orphan clean-main
          git add -A
          git status --short | head -50
          git commit -m "ci: clean main without .vercel/output (fix PGlite / config.json error)"

          # Force main to this clean history
          git branch -M main
          git push origin main --force
